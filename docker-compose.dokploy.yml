# Dokploy deployment of Litrito on PostgreSQL.
#
# Dokploy injects `dokploy-network` and the Traefik labels/domains from its UI,
# so this file only declares the services, their ports, env and the data volume.
# In Dokploy → Domains, route each domain to the right service + container port:
#
#   litrito.athas.mx               -> web        : 3000
# Set PostgreSQL and Better Auth variables in Dokploy.

services:
  postgres:
    image: postgis/postgis:18-3.6
    restart: unless-stopped
    mem_limit: 512m
    mem_reservation: 256m
    shm_size: 128m
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-litrito}
      - POSTGRES_USER=${POSTGRES_USER:-litrito}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    command:
      - postgres
      - -c
      - shared_buffers=128MB
      - -c
      - effective_cache_size=384MB
      - -c
      - work_mem=4MB
      - -c
      - maintenance_work_mem=64MB
      - -c
      - max_connections=50
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: migration
    restart: "no"
    mem_limit: 256m
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-litrito}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-litrito}
      - POSTGRES_POOL_SIZE=1
      - POSTGRES_APPLICATION_NAME=litrito-migrate
    depends_on:
      postgres:
        condition: service_healthy

  ingestion:
    build:
      context: .
      dockerfile: Dockerfile
      target: ingestion
    restart: unless-stopped
    mem_limit: 512m
    mem_reservation: 128m
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-litrito}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-litrito}
      - POSTGRES_POOL_SIZE=2
      - POSTGRES_APPLICATION_NAME=litrito-ingestion
      - INGESTION_BATCH_SIZE=50
    depends_on:
      migrate:
        condition: service_completed_successfully

  migration:
    profiles: ["tools"]
    build:
      context: .
      dockerfile: Dockerfile
      target: migration
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-litrito}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-litrito}
      - POSTGRES_POOL_SIZE=1
      - POSTGRES_APPLICATION_NAME=litrito-migration
    volumes:
      - ${MIGRATION_DATA_DIR:-/opt/litrito-migration}:/migration:ro
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
      args:
        # Umami analytics, baked in at build time.
        VITE_UMAMI_WEBSITE_ID: ${VITE_UMAMI_WEBSITE_ID}
        VITE_UMAMI_SRC: ${VITE_UMAMI_SRC:-https://umami.athas.mx/script.js}
    environment:
      - NODE_ENV=production
      - PORT=3000
      - APP_DOMAIN=${APP_DOMAIN}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-litrito}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-litrito}
      - BETTER_AUTH_URL=${BETTER_AUTH_URL}
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - FACEBOOK_CLIENT_ID=${FACEBOOK_CLIENT_ID:-}
      - FACEBOOK_CLIENT_SECRET=${FACEBOOK_CLIENT_SECRET:-}
      - OVERPASS_URL=${OVERPASS_URL:-https://overpass.kumi.systems/api/interpreter}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - SMTP_SECURE=${SMTP_SECURE:-}
      - SMTP_FROM_EMAIL=${SMTP_FROM_EMAIL:-}
      - SMTP_FROM_NAME=${SMTP_FROM_NAME:-Litrito}
      # Umami read at runtime by the root loader (SSR) as a fallback to the build arg.
      - VITE_UMAMI_WEBSITE_ID=${VITE_UMAMI_WEBSITE_ID}
      - VITE_UMAMI_SRC=${VITE_UMAMI_SRC:-https://umami.athas.mx/script.js}
    mem_limit: 768m
    mem_reservation: 256m
    expose:
      - "3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 20s
    # NOTE: gzip/brotli compression of the dynamic SSR HTML and the security
    # response headers are NOT configured here. Dokploy regenerates each
    # service's Traefik labels from its UI and strips custom middleware labels
    # from compose (Dokploy issue #484), so those must live in Traefik's dynamic
    # config on the host instead. See deploy/traefik/litrito-dynamic.yml for the
    # middleware definitions and the one-time install steps. (Static /assets/*
    # are already pre-compressed by Nitro via compressPublicAssets.)

volumes:
  postgres_data:
