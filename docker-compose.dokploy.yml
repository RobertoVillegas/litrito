# Dokploy deployment of the self-hosted Litrito stack.
#
# Dokploy injects `dokploy-network` and the Traefik labels/domains from its UI,
# so this file only declares the services, their ports, env and the data volume.
# In Dokploy → Domains, route each domain to the right service + container port:
#
#   litrito.athas.mx               -> web        : 3000
#   litrito-convex.athas.mx        -> backend     : 3210   (API + websocket)
#   litrito-convex-http.athas.mx   -> backend     : 3211   (HTTP actions: auth + /stations/export)
#   litrito-convex-admin.athas.mx  -> dashboard   : 6791
#
# The backend container serves two ports, so add two domains both pointing at
# the `backend` service (one to 3210, one to 3211). Set the env vars from
# .env.selfhost in the Dokploy service settings.

services:
  backend:
    image: ghcr.io/get-convex/convex-backend:latest
    stop_grace_period: 10s
    stop_signal: SIGINT
    expose:
      - "3210" # API + client websocket
      - "3211" # HTTP actions: auth + /stations/export
    volumes:
      - convex_data:/convex/data
    environment:
      # Must be the PUBLIC https URLs — Convex uses them for CORS and as the
      # origin the browser/CLI connect to.
      - CONVEX_CLOUD_ORIGIN=https://${CONVEX_DOMAIN}
      - CONVEX_SITE_ORIGIN=https://${CONVEX_HTTP_DOMAIN}
      - INSTANCE_NAME=${INSTANCE_NAME:-litrito}
      - INSTANCE_SECRET=${INSTANCE_SECRET}
      - DISABLE_BEACON=true
      - RUST_LOG=${RUST_LOG:-info}
      - DOCUMENT_RETENTION_DELAY=${DOCUMENT_RETENTION_DELAY:-172800}
      # --- Optional Postgres engine instead of bundled SQLite ---
      # - POSTGRES_URL=${POSTGRES_URL}
      # - DO_NOT_REQUIRE_SSL=${DO_NOT_REQUIRE_SSL}
    healthcheck:
      test: curl -f http://localhost:3210/version
      interval: 5s
      start_period: 10s
      retries: 5

  dashboard:
    image: ghcr.io/get-convex/convex-dashboard:latest
    stop_grace_period: 10s
    stop_signal: SIGINT
    expose:
      - "6791"
    environment:
      - NEXT_PUBLIC_DEPLOYMENT_URL=https://${CONVEX_DOMAIN}
    depends_on:
      backend:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Browser-facing Convex URLs, baked into the bundle at build time.
        VITE_CONVEX_URL: https://${CONVEX_DOMAIN}
        VITE_CONVEX_SITE_URL: https://${CONVEX_HTTP_DOMAIN}
    environment:
      - NODE_ENV=production
      - PORT=3000
    expose:
      - "3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  convex_data:
