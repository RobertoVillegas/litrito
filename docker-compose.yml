# Litrito stack: PostgreSQL, an isolated ingestion worker and web.
#
# Quick start (local trial):   docker compose up -d
# With the web app:            docker compose --profile web up -d
# On a VPS:                    docker compose --env-file .env.selfhost --profile web up -d
#

services:
  postgres:
    image: postgis/postgis:18-3.6
    restart: unless-stopped
    mem_limit: 512m
    mem_reservation: 256m
    shm_size: 128m
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-litrito}
      - POSTGRES_USER=${POSTGRES_USER:-litrito}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-litrito}
    command:
      - postgres
      - -c
      - shared_buffers=128MB
      - -c
      - effective_cache_size=384MB
      - -c
      - work_mem=4MB
      - -c
      - maintenance_work_mem=64MB
      - -c
      - max_connections=50
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

  migrate:
    profiles: ["web"]
    build:
      context: .
      dockerfile: Dockerfile
      target: migration
    restart: "no"
    mem_limit: 256m
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-litrito}:${POSTGRES_PASSWORD:-litrito}@postgres:5432/${POSTGRES_DB:-litrito}
      - POSTGRES_POOL_SIZE=1
      - POSTGRES_APPLICATION_NAME=litrito-migrate
    depends_on:
      postgres:
        condition: service_healthy

  ingestion:
    profiles: ["web"]
    build:
      context: .
      dockerfile: Dockerfile
      target: ingestion
    restart: unless-stopped
    mem_limit: 512m
    mem_reservation: 128m
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-litrito}:${POSTGRES_PASSWORD:-litrito}@postgres:5432/${POSTGRES_DB:-litrito}
      - POSTGRES_POOL_SIZE=2
      - POSTGRES_APPLICATION_NAME=litrito-ingestion
      - INGESTION_BATCH_SIZE=50
    depends_on:
      migrate:
        condition: service_completed_successfully

  web:
    profiles: ["web"]
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
      args:
        VITE_UMAMI_WEBSITE_ID: ${VITE_UMAMI_WEBSITE_ID:-}
        VITE_UMAMI_SRC: ${VITE_UMAMI_SRC:-https://umami.athas.mx/script.js}
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - APP_DOMAIN=${APP_DOMAIN:-127.0.0.1:3000}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-litrito}:${POSTGRES_PASSWORD:-litrito}@postgres:5432/${POSTGRES_DB:-litrito}
      - BETTER_AUTH_URL=${BETTER_AUTH_URL:-http://127.0.0.1:3000}
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - FACEBOOK_CLIENT_ID=${FACEBOOK_CLIENT_ID:-}
      - FACEBOOK_CLIENT_SECRET=${FACEBOOK_CLIENT_SECRET:-}
      - OVERPASS_URL=${OVERPASS_URL:-https://overpass.kumi.systems/api/interpreter}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - SMTP_SECURE=${SMTP_SECURE:-}
      - SMTP_FROM_EMAIL=${SMTP_FROM_EMAIL:-}
      - SMTP_FROM_NAME=${SMTP_FROM_NAME:-Litrito}
      - VITE_UMAMI_WEBSITE_ID=${VITE_UMAMI_WEBSITE_ID:-}
      - VITE_UMAMI_SRC=${VITE_UMAMI_SRC:-https://umami.athas.mx/script.js}
    mem_limit: 768m
    mem_reservation: 256m
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 20s

volumes:
  postgres_data:
