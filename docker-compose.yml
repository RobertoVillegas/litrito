# Self-hosted Litrito stack: the open-source Convex backend, the Convex
# dashboard, and the web app — all in one compose file.
#
# Quick start (local trial):   docker compose up -d
# With the web app:            docker compose --profile web up -d
# On a VPS:                    docker compose --env-file .env.selfhost --profile web up -d
#
# See SELFHOST.md for the full bootstrap (admin key + npx convex deploy).

services:
  backend:
    image: ghcr.io/get-convex/convex-backend:latest
    stop_grace_period: 10s
    stop_signal: SIGINT
    ports:
      - "3210:3210" # API + client websocket (VITE_CONVEX_URL)
      - "3211:3211" # HTTP actions: auth + /stations/export (VITE_CONVEX_SITE_URL)
    volumes:
      - convex_data:/convex/data
    environment:
      # Public origins the browser and the `npx convex` CLI use to reach this
      # backend. Defaults work for a local trial; on a VPS set them to your
      # domain/IP via .env.selfhost.
      - CONVEX_CLOUD_ORIGIN=${CONVEX_CLOUD_ORIGIN:-http://127.0.0.1:3210}
      - CONVEX_SITE_ORIGIN=${CONVEX_SITE_ORIGIN:-http://127.0.0.1:3211}
      - INSTANCE_NAME=${INSTANCE_NAME:-litrito}
      - INSTANCE_SECRET=${INSTANCE_SECRET:-}
      - DISABLE_BEACON=true
      - RUST_LOG=${RUST_LOG:-info}
      # How long deleted/old document versions are retained (seconds). Default 2d.
      - DOCUMENT_RETENTION_DELAY=${DOCUMENT_RETENTION_DELAY:-172800}
      # --- Optional: back Convex with Postgres instead of the bundled SQLite ---
      # Point at an empty database; Convex manages its own schema inside it.
      # - POSTGRES_URL=${POSTGRES_URL:-}
      # - DO_NOT_REQUIRE_SSL=${DO_NOT_REQUIRE_SSL:-}
    healthcheck:
      test: curl -f http://localhost:3210/version
      interval: 5s
      start_period: 10s
      retries: 5

  dashboard:
    image: ghcr.io/get-convex/convex-dashboard:latest
    stop_grace_period: 10s
    stop_signal: SIGINT
    ports:
      - "6791:6791"
    environment:
      - NEXT_PUBLIC_DEPLOYMENT_URL=${CONVEX_CLOUD_ORIGIN:-http://127.0.0.1:3210}
    depends_on:
      backend:
        condition: service_healthy

  # Build/run the app only after functions are deployed (see SELFHOST.md), since
  # the bundle bakes in the backend URL and expects the schema to exist.
  web:
    profiles: ["web"]
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_CONVEX_URL: ${CONVEX_CLOUD_ORIGIN:-http://127.0.0.1:3210}
        VITE_CONVEX_SITE_URL: ${CONVEX_SITE_ORIGIN:-http://127.0.0.1:3211}
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      # Also needed at runtime: auth-server.ts reads process.env.VITE_CONVEX_*
      # during SSR (Nitro doesn't inline process.env.VITE_* server-side).
      - VITE_CONVEX_URL=${CONVEX_CLOUD_ORIGIN:-http://127.0.0.1:3210}
      - VITE_CONVEX_SITE_URL=${CONVEX_SITE_ORIGIN:-http://127.0.0.1:3211}
    depends_on:
      backend:
        condition: service_healthy

volumes:
  convex_data:
