# Traefik dynamic configuration for the Litrito stack.
#
# WHY THIS FILE EXISTS (not compose labels):
# Dokploy regenerates each service's Traefik labels from its Domains UI and
# STRIPS custom middleware labels you put in docker-compose (Dokploy issue #484).
# So middlewares must be defined in Traefik's dynamic-config directory, which is
# watched by the file provider and survives redeploys.
#
# WHY IT DECLARES ITS OWN ROUTERS:
# Defining the middlewares alone is not enough — something has to attach them.
# Attaching on the `websecure` entryPoint (an earlier version of this file) needs
# a static-config edit plus a Traefik restart, and applies to EVERY app on the
# host: `frameDeny` would break anything that relies on being iframed (e.g.
# Umami shared-report embeds). Declaring litrito's own routers here keeps the
# middlewares scoped to litrito.com and hot-reloads with no restart, which is
# the same pattern litrito-www-redirect.yml already uses.
#
# These routers deliberately outrank Dokploy's label-generated ones: Traefik
# resolves competing rules by priority, and an unset priority defaults to the
# rule's length, so the explicit 100 below wins for Host(`litrito.com`). The
# container name is stable across redeploys (compose project naming), which is
# what makes the file-provider service durable.
#
# INSTALL (on the Dokploy host):
#   scp deploy/traefik/litrito-dynamic.yml \
#       <host>:/tmp/litrito-dynamic.yml
#   ssh <host> 'sudo install -m 644 /tmp/litrito-dynamic.yml \
#       /etc/dokploy/traefik/dynamic/litrito-dynamic.yml'
#   # Traefik hot-reloads the file provider. No restart, no downtime.
#
# VERIFY:
#   curl -sI https://litrito.com/ -H "Accept-Encoding: br,gzip" \
#     | grep -i "content-encoding\|strict-transport\|x-frame\|x-content-type"
#   -> expect: content-encoding: gzip (or br), strict-transport-security, etc.
#
# ROLLBACK:
#   sudo rm /etc/dokploy/traefik/dynamic/litrito-dynamic.yml
#   Traefik hot-reloads and Dokploy's own routers take over again within seconds.

http:
  routers:
    # Outranks Dokploy's label router for the apex so the middlewares below
    # actually apply. Mirrors the TLS setup Dokploy generates (letsencrypt on
    # the websecure entryPoint) so the existing certificate keeps renewing.
    litrito-apex-websecure:
      rule: Host(`litrito.com`)
      priority: 100
      entryPoints:
        - websecure
      service: litrito-apex-service
      middlewares:
        - litrito-compress
        - litrito-secheaders
      tls:
        certResolver: letsencrypt

    # `redirect-to-https` lives in middlewares.yml, same provider, so it
    # resolves unqualified here. This mirrors the label Dokploy puts on its own
    # port-80 router.
    litrito-apex-web:
      rule: Host(`litrito.com`)
      priority: 100
      entryPoints:
        - web
      service: litrito-apex-service
      middlewares:
        - redirect-to-https

  middlewares:
    # gzip/brotli/zstd for the dynamic SSR HTML document. Static /assets/* are
    # already pre-compressed by Nitro (compressPublicAssets); this covers the
    # ~150 KB HTML that Nitro doesn't compress (PSI "document request latency").
    litrito-compress:
      compress: {}

    # Security response headers flagged by PageSpeed's Best-Practices audit.
    # Scoped to litrito.com, so `frameDeny` cannot affect other apps on the
    # host. Litrito's OAuth is redirect-based, so COOP is safe.
    litrito-secheaders:
      headers:
        stsSeconds: 31536000
        stsIncludeSubdomains: true
        stsPreload: true
        contentTypeNosniff: true
        frameDeny: true
        referrerPolicy: strict-origin-when-cross-origin
        customResponseHeaders:
          Cross-Origin-Opener-Policy: same-origin

  services:
    litrito-apex-service:
      loadBalancer:
        servers:
          - url: http://litrito-web-gxr9ar-web-1:3000
        passHostHeader: true
